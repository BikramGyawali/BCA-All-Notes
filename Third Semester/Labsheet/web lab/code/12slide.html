<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      * {
        padding: 0;
        margin: 0;
      }
      h1 {
        /* text-align: center; */
        color: blueviolet;
      }
      .slides {
        position: relative;
        width: 500px;
        height: 500px;
        margin: auto;
        overflow: hidden;
        margin-top: 20px;
      }
      .slide {
        position: absolute;
        height: 100%;
        width: 100%;
        animation: images 10s infinite;
        opacity: 0;
      }
      img {
        width: 90%;
        height: 50%;
      }
      .slide:nth-child(1) {
        animation-delay: 1s;
      }
      .slide:nth-child(2) {
        animation-delay: 3s;
      }
      .slide:nth-child(3) {
        animation-delay: 6s;
      }

      @keyframes images {
        0% {
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        30% {
          opacity: 1;
        }
        40% {
          opacity: 0;
        }
        100% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="slides">
      <h1>Slide show in css</h1>
      <div class="slide"><img src="./images_folder/1.png" alt="Temple" /></div>
      <div class="slide">
        <img src="./images_folder/2.jpeg" alt="Temple" />
      </div>
      <div class="slide">
        <img src="./images_folder/image.png" alt="Temple" />
      </div>
    </div>
  </body>
</html>
