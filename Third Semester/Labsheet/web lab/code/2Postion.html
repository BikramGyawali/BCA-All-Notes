<!-- 2. Write HTML code to set an image in any particular position on a page.  -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>image at a particular position</title>
  </head>
  <body>
    <center>
      <h1>Image at a particular position</h1>
      <p>Image of pashupathi temple.</p>
      <img
        src="./images_folder/image.png"
        alt="Image of pashupathi temple"
        height="200"
        width="300"
      />
    </center>
  </body>
</html>
