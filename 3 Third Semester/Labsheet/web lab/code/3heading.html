<!-- Write HTML code to prepare a document using different heading format. Eg. 
(H1 to H6).  -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heading format</title>
  </head>
  <body>
    <center>
      <h1>About Myself</h1>
      <h2>My Name</h2>
      <p>My name is Bikram Gyawali</p>
      <h3>My Age</h3>
      <p>I am <u>19</u> year old</p>
      <h3>My Study</h3>
      <p>I am currently studing <i>BCA 3rd sem at SMC</i>.</p>
      <h4>Address</h4>
      <p>I am from <b>Butwal</b></p>
    </center>
  </body>
</html>
