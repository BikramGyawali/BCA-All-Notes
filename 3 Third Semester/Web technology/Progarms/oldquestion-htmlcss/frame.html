<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font: 24px;
        margin: 0px;
        padding: 0px;
        font-family: "Courier new , Courier ,monospace";
      }
      .logo {
        border: 1px solid black;
        padding: 10px;
      }
      nav {
        border: 1px solid black;
        text-align: center;
        padding: 15px;
        font: bold;
      }
      header {
        padding: 15px;
        font: bolder;
        border: 1px solid black;
      }
      .main {
        display: flex;
        min-height: 100px;

        border: 1px solid black;
      }
      .main .sidebar {
        border-right: 1px solid black;
        align-items: center;
        width: 50%;
        padding: 20px;
      }
      .main .body {
        padding: 20px;
        width: 50%;

        text-align: center;
      }
      footer {
        border: 1px solid black;
        padding: 20px;

        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="logo">
      <img src="" alt="Logo section" height="30px" />
    </div>
    <nav>Navigation</nav>
    <header>Header Banner</header>
    <div class="main">
      <div class="sidebar">Side Bar</div>
      <div class="body">Body</div>
    </div>
    <footer>Footer</footer>
  </body>
</html>
