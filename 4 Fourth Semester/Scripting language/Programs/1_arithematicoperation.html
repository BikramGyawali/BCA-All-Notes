<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      const sum = (a, b) => {
        return a + b;
      };
      const sub = (a, b) => {
        return a - b;
      };
      const mul = (a, b) => {
        return a * b;
      };
      const div = (a, b) => {
        return a / b;
      };
      document.write(
        "The value of a =6 and b=3 <br>a+b=" +
          sum(6, 3) +
          "<br> a-b=" +
          sub(6, 3) +
          "<br> a*b=" +
          mul(6, 3) +
          "<br> a/b =" +
          div(6, 3)
      );
    </script>
  </body>
</html>
