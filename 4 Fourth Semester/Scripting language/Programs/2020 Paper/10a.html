<!-- a) Write a program which includes a function sum(). This function sum() should be designed to add an arbitrary list of parameters. (For e.g ., if you call the function sum() as sum (1, 2) it should return the result 3 and if again you call the function sum() as sum(1,3,4) it should return the result 8). -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function add(...nums) {
        total = 0;
        for (let a of nums) {
          total += a;
        }
        return total;
      }

      document.writeln("The sum is " + add(1, 2) + "<br>");
      document.writeln("The sum is " + add(2, 3, 4));
    </script>
  </body>
</html>
