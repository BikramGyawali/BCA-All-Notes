<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let n = prompt("Enter the number of Numbers");
      let arr = [];
      let sum = 0;

      for (i = 0; i < n; i++) {
        arr[i] = parseInt(prompt("Enter the  " + (i + 1)));
        sum += arr[i];
      }
      let avg = sum / n;
      let largest = arr[0];
      for (i = 0; i <= arr.length; i++) {
        if (arr[i] > largest) {
          largest = arr[i];
        }
      }

      document.writeln("sum is " + sum + "<br>");
      document.writeln("Average is " + avg + "<br>");
      document.writeln("Largest Number is " + largest);
    </script>
  </body>
</html>
