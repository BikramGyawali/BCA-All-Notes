<!-- What is the use of jQuery? Write the sample program to show and hide the certain div with the use of jQuery. -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

  <script>
    $(document).ready(function () {
      $("#hide").click(function () {
        //the hide is id in the btn so we use #
        $("div").hide();
      });
      $(".show").click(function () {
        //the show is class in the btn so we use .
        $("div").show();
      });
    });
  </script>
  <body>
    <div>This is for the testing the show and hide functin</div>
    <br />
    <button class="show">Show</button>
    <button id="hide">hide</button>
  </body>
</html>
