<!-- What is dialog box? Explain different dialog boxes with suitable example in JavaScript. -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      const alertBox = () => {
        alert("This is alert");
      };
      const conformBox = () => {
        const value = confirm("Are you sure");
        if (value) {
          alert("You clicked ok");
        }
        if (!value) {
          alert("You click not ok");
        }
      };
      const promptBox = () => {
        var data = prompt("Enter Your name");
        document.writeln("Welcome " + data);
      };
    </script>
  </head>
  <body>
    <button onclick="alertBox()">Alert Box</button> <br />
    <button onclick="conformBox()">Conform Box</button> <br />
    <button onclick="promptBox()">Prompt Box</button>
  </body>
</html>
